<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <section class="hero-bg h-screen flex items-center justify-center px-4">
        <div class="max-w-4xl w-full text-center">
            <h1 class="text-4xl md:text-6xl font-bold text-white mb-6 drop-shadow-lg">
                Find Your Dream Space in <span class="text-blue-400">South Luzon</span>
            </h1>
            <p class="text-lg text-gray-200 mb-10 max-w-2xl mx-auto">
                Discover premium properties across Batangas, Laguna, and Cavite. 
                Your journey home starts here.
            </p>

            <div class="bg-white/20 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-white/30">
                <form class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    
                    <div class="flex flex-col text-left">
                        <label class="text-xs font-semibold text-white uppercase ml-2 mb-1">Location</label>
                        <select class="w-full p-3 rounded-xl bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Location</option>
                            <option value="batangas">Batangas</option>
                            <option value="laguna">Laguna</option>
                            <option value="cavite">Cavite</option>
                        </select>
                    </div>

                    <div class="flex flex-col text-left">
                        <label class="text-xs font-semibold text-white uppercase ml-2 mb-1">Property Type</label>
                        <select class="w-full p-3 rounded-xl bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Model</option>
                            <option value="house-lot">House and Lot</option>
                            <option value="condo">Condominium</option>
                            <option value="commercial">Commercial Lot</option>
                            <option value="lot-only">Lot Only</option>
                        </select>
                    </div>

                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 ease-in-out transform hover:scale-105">
                            Search Properties
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </section>

</body>
</html>
